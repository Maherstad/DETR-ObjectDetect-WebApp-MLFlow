[project]
name = "detr-lifecycle"
version = "0.2.0"
description = "DETR object detection with an MLflow model lifecycle: registry aliases, an evaluation gate before promotion, and a served PyFunc model."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Maher Al Sadeq" }]
dependencies = [
    "mlflow>=3.10",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.50",
    "timm>=1.0",
    "torchmetrics[detection]>=1.6",
    "faster-coco-eval>=1.6",
    "pillow>=11",
    "pandas>=2.2",
    "requests>=2.32",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]

[project.scripts]
detr-lifecycle = "detr_lifecycle.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4",
    "types-requests",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detr_lifecycle"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: downloads real weights or data; skipped in CI"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

# Linux (Docker, CI) gets CPU-only torch: a ~200 MB wheel instead of ~2.5 GB of CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
